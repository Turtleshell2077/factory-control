name: CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  STACK_NAME: factory
  # без дополнительных манифестов attestation, чтобы ghcr.io прочитал метку source из образа
  BUILDX_NO_DEFAULT_ATTESTATIONS: 1

jobs:
  test:
    name: Тесты
    runs-on: ubuntu-latest
    steps:
      - name: Получение кода
        uses: actions/checkout@v7

      - name: Установка Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Тесты backend
        run: mvn -B test --file backend/pom.xml

      - name: Тесты emulator
        run: mvn -B test --file emulator/pom.xml

  build:
    name: Сборка и публикация образов
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Получение кода
        uses: actions/checkout@v7

      - name: Имя реестра
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/factory-control" >> $GITHUB_ENV

      - name: Вход в GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка образов
        run: docker compose build

      - name: Публикация образов
        run: docker compose push

  deploy:
    name: Деплой в Docker Swarm и проверка
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Получение кода
        uses: actions/checkout@v7

      - name: Имя реестра
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/factory-control" >> $GITHUB_ENV

      - name: Вход в GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Создание кластера Swarm
        run: docker swarm init --advertise-addr $(hostname -I | awk '{print $1}')

      - name: Деплой стека
        run: docker stack deploy -c docker-compose.yaml --with-registry-auth $STACK_NAME

      # проверки идут из временного контейнера, подключённого к сети front-net
      # (сеть объявлена attachable), запросы проходят через proxy, как из браузера
      - name: Ожидание запуска сервисов
        run: |
          for i in $(seq 1 40); do
            if docker run --rm --network ${STACK_NAME}_front-net $IMAGE_PREFIX/proxy:latest \
                 wget -qO- -T 5 http://proxy/api/health; then
              echo
              echo "Система запущена"
              exit 0
            fi
            echo "Ждём запуска сервисов, попытка $i"
            sleep 5
          done
          docker service ls
          docker stack ps $STACK_NAME --no-trunc
          docker service logs ${STACK_NAME}_backend --tail 50
          docker service logs ${STACK_NAME}_proxy --tail 50
          exit 1

      - name: Проверка работы системы
        run: |
          docker service ls
          docker run --rm --network ${STACK_NAME}_front-net $IMAGE_PREFIX/proxy:latest sh -c '
            set -e
            wget -qO- -T 5 http://proxy/ | grep "Панель управления цехом"
            wget -qO- -T 5 http://proxy/api/machines
            echo
            wget -qO- -T 5 --header "Content-Type: application/json" \
                 --post-data "{\"action\":\"speed\",\"value\":55}" http://proxy/api/machines/1/command
            echo
            sleep 6
            wget -qO- -T 5 http://proxy/api/events | grep -o "Скорость изменена на 55"
            wget -qO- -T 5 http://proxy/api/machines | grep -o "\"speed\":55"
            echo "Команда дошла до оборудования, телеметрия обновилась"
          '

      - name: Удаление стека
        if: always()
        run: docker stack rm $STACK_NAME
