name: CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  STACK_NAME: factory
  # без дополнительных манифестов attestation, чтобы ghcr.io прочитал метку source из образа
  BUILDX_NO_DEFAULT_ATTESTATIONS: 1

jobs:
  test:
    name: Тесты
    runs-on: ubuntu-latest
    steps:
      - name: Получение кода
        uses: actions/checkout@v7

      - name: Установка Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Тесты backend
        run: mvn -B test --file backend/pom.xml

      - name: Тесты emulator
        run: mvn -B test --file emulator/pom.xml

  build:
    name: Сборка и публикация образов
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Получение кода
        uses: actions/checkout@v7

      - name: Имя реестра
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/factory-control" >> $GITHUB_ENV

      - name: Вход в GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка образов
        run: docker compose build

      - name: Публикация образов
        run: docker compose push

  deploy:
    name: Деплой в Docker Swarm и проверка
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Получение кода
        uses: actions/checkout@v7

      - name: Имя реестра
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/factory-control" >> $GITHUB_ENV

      - name: Вход в GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Создание кластера Swarm
        run: docker swarm init --advertise-addr $(hostname -I | awk '{print $1}')

      - name: Деплой стека
        run: docker stack deploy -c docker-compose.yaml --with-registry-auth $STACK_NAME

      - name: Ожидание запуска сервисов
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost/api/health; then
              echo
              echo "Система запущена"
              exit 0
            fi
            echo "Ждём запуска сервисов, попытка $i"
            sleep 5
          done
          docker service ls
          docker service logs ${STACK_NAME}_backend --tail 50
          exit 1

      - name: Проверка работы системы
        run: |
          docker service ls
          curl -sf http://localhost/ | grep "Панель управления цехом"
          curl -sf http://localhost/api/machines
          echo
          curl -sf -X POST -H "Content-Type: application/json" \
               -d '{"action":"speed","value":55}' http://localhost/api/machines/1/command
          echo
          sleep 6
          curl -sf http://localhost/api/events | grep "Скорость изменена на 55"
          curl -sf http://localhost/api/machines | grep '"speed":55'
          echo "Команда дошла до оборудования, телеметрия обновилась"

      - name: Удаление стека
        if: always()
        run: docker stack rm $STACK_NAME
